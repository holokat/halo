<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Permissions-Policy" content="clipboard-write=(self)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load primary font (Inter) synchronously for initial render -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Load additional fonts asynchronously to avoid render blocking -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Lato:wght@400;700&family=Outfit:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Geist+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&family=Mona+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Lato:wght@400;700&family=Outfit:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Geist+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&family=Mona+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    /></noscript>

    <title>Halo</title>
    <meta name="description" content="A user-friendly Nostr client for exploring relay feeds" />
    <meta
      name="keywords"
      content="Halo, nostr, web, client, relay, feed, social, pwa, simple, clean"
    />

    <meta name="apple-mobile-web-app-title" content="Halo" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon-16x16.png?v=4" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32x32.png?v=4" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-64x64.png?v=4" sizes="64x64" type="image/png" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />

    <meta property="og:url" content="https://haloapp.fyi" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Halo" />
    <meta
      property="og:description"
      content="A user-friendly Nostr client for exploring relay feeds"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/holokat/halo/master/resources/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
